name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python scripts/dev.py check
      - run: uv run python -m pytest
      - run: uv run python scripts/dev.py python-dist-check

  public-audit:
    name: Public tree and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group dev
      - run: uv run python scripts/dev.py public-audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  protocol-dotnet:
    name: Game-independent .NET protocol tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/KittenIO.Protocol.Tests/KittenIO.Protocol.Tests.csproj --configuration Release
      - run: dotnet tests/KittenIO.Protocol.Tests/bin/Release/net10.0/KittenIO.Protocol.Tests.dll

  # Mod and KSA contract tests require the locally installed, pinned KSA and
  # StarMap binaries. They remain release gates in ./scripts/dev test.
