name: Bug report
description: Report reproducible KittenIO behaviour.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected and observed behaviour.
    validations:
      required: true
  - type: input
    id: kittenio-version
    attributes:
      label: KittenIO version or commit
    validations:
      required: true
  - type: input
    id: ksa-version
    attributes:
      label: KSA and StarMap versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove pairing tokens and other secrets before posting.
